name: Deploy WebXR game to GitHub Pages

# Builds webxr/ on GitHub and publishes webxr/dist as the Pages site.
# The built bundle is never pushed as a commit.
# One-time repo setting: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'webxr/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webxr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: webxr/.nvmrc
          cache: npm
          cache-dependency-path: webxr/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Check the build output
        run: test -f dist/cards.html && test -f dist/index.html && test -f dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webxr/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
