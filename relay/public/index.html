<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Send a deck to your headset</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <h1>Send a deck to your headset</h1>
  <p>Enter the 6-character code shown in the headset, paste your deck JSON below and press Send.
    The code works once and expires after 15 minutes.</p>
  <form id="send-form" novalidate>
    <label for="code">Pairing code</label>
    <input id="code" name="code" maxlength="6" autocomplete="off" spellcheck="false" required>
    <label for="deck">Deck JSON</label>
    <textarea id="deck" name="deck" spellcheck="false" required
      placeholder='{"version": 1, "title": "My deck", "cards": [{"front": "Capital of France?", "back": "Paris"}]}'></textarea>
    <button type="submit">Send</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="/app.js"></script>
</body>
</html>
