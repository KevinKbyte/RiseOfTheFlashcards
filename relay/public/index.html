<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Send a deck to your headset</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 0.5rem; }
    input { text-transform: uppercase; letter-spacing: 0.2em; max-width: 12rem; }
    textarea { min-height: 18rem; font-family: ui-monospace, monospace; font-size: 0.9rem; }
    button { margin-top: 1rem; font: inherit; padding: 0.5rem 1.5rem; }
    #status { margin-top: 1rem; min-height: 1.5em; }
    .error { color: #b00020; }
    .ok { color: #1b5e20; }
  </style>
</head>
<body>
  <h1>Send a deck to your headset</h1>
  <p>Enter the 6-character code shown in the headset, paste your deck JSON below and press Send.
    The code works once and expires after 15 minutes.</p>
  <form id="send-form" novalidate>
    <label for="code">Pairing code</label>
    <input id="code" name="code" maxlength="6" autocomplete="off" spellcheck="false" required>
    <label for="deck">Deck JSON</label>
    <textarea id="deck" name="deck" spellcheck="false" required
      placeholder='{"version": 1, "title": "My deck", "cards": [{"front": "Capital of France?", "back": "Paris"}]}'></textarea>
    <button type="submit">Send</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script>
    // Crockford base32 without I, L, O, U; the relay re-checks everything server-side.
    const CODE_PATTERN = /^[0-9A-HJKMNP-TV-Z]{6}$/;
    const MESSAGES = {
      400: 'The deck or code was rejected',
      404: 'Unknown or expired code. Ask the headset for a new one.',
      409: 'A deck was already sent for this code.',
      413: 'The deck is too large (200 KB maximum).',
      429: 'Too many attempts. Wait a minute and try again.',
      503: 'Deck import is currently unavailable.',
    };

    const form = document.getElementById('send-form');
    const statusLine = document.getElementById('status');

    function show(text, kind) {
      statusLine.textContent = text;
      statusLine.className = kind;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const code = document.getElementById('code').value.trim().toUpperCase();
      const deck = document.getElementById('deck').value;
      if (!CODE_PATTERN.test(code)) {
        show('The code is 6 characters: digits and letters except I, L, O and U.', 'error');
        return;
      }
      const button = form.querySelector('button');
      button.disabled = true;
      show('Sending...', '');
      try {
        const res = await fetch('/api/pair/' + code, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: deck,
        });
        if (res.ok) {
          show('Sent. Your headset will pick up the deck within a few seconds.', 'ok');
          return;
        }
        let detail = '';
        try {
          detail = (await res.json()).error || '';
        } catch {
          // Non-JSON error bodies fall back to the generic message.
        }
        const base = MESSAGES[res.status] || 'Sending failed (HTTP ' + res.status + ').';
        show(res.status === 400 && detail ? base + ': ' + detail : base, 'error');
      } catch {
        show('Network error. Check your connection and try again.', 'error');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
